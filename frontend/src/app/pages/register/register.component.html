<div class="register-page">
  <div class="register-container">
    <div class="register-card">
      <!-- Header -->
      <div class="register-header">
        <h1 class="register-title">{{ 'AUTH.CREATE_ACCOUNT' | translate }}</h1>
        <p class="register-subtitle">{{ 'AUTH.JOIN_US' | translate }}</p>
      </div>

      <!-- Registration Form -->
      <form (ngSubmit)="onSubmit()" class="register-form">
        
        <!-- Username -->
        <div class="form-group">
          <label for="username" class="form-label">{{ 'FORM.USERNAME' | translate }} *</label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="userData.username"
            class="form-input"
            [placeholder]="'FORM.USERNAME_PLACEHOLDER' | translate"
            [disabled]="isLoading"
            required
            autocomplete="username"
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">{{ 'FORM.EMAIL' | translate }} *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="userData.email"
            class="form-input"
            [placeholder]="'FORM.EMAIL_EXAMPLE' | translate"
            [disabled]="isLoading"
            required
            autocomplete="email"
          />
        </div>

        <!-- First and Last Name -->
        <div class="form-row">
          <div class="form-group">
            <label for="firstName" class="form-label">{{ 'FORM.FIRST_NAME' | translate }} *</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              [(ngModel)]="userData.firstName"
              class="form-input"
              [placeholder]="'FORM.FIRST_NAME_PLACEHOLDER' | translate"
              [disabled]="isLoading"
              required
              autocomplete="given-name"
            />
          </div>

          <div class="form-group">
            <label for="lastName" class="form-label">{{ 'FORM.LAST_NAME' | translate }} *</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              [(ngModel)]="userData.lastName"
              class="form-input"
              [placeholder]="'FORM.LAST_NAME_PLACEHOLDER' | translate"
              [disabled]="isLoading"
              required
              autocomplete="family-name"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">{{ 'FORM.PASSWORD' | translate }} *</label>
          <div class="password-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="userData.password"
              class="form-input"
              [placeholder]="'FORM.PASSWORD_MIN' | translate"
              [disabled]="isLoading"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [disabled]="isLoading"
            >
              <span *ngIf="!showPassword">👁</span>
              <span *ngIf="showPassword">🙈</span>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">{{ 'FORM.CONFIRM_PASSWORD' | translate }} *</label>
          <div class="password-input-wrapper">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="userData.confirmPassword"
              class="form-input"
              [placeholder]="'FORM.CONFIRM_PASSWORD_PLACEHOLDER' | translate"
              [disabled]="isLoading"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="toggleConfirmPasswordVisibility()"
              [disabled]="isLoading"
            >
              <span *ngIf="!showConfirmPassword">👁</span>
              <span *ngIf="showConfirmPassword">🙈</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn-submit"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">{{ 'AUTH.CREATE_ACCOUNT' | translate }}</span>
          <span *ngIf="isLoading" class="loading-spinner">
            <span class="spinner"></span>
            {{ 'AUTH.CREATING' | translate }}
          </span>
        </button>
      </form>

      <!-- Login Link -->
      <div class="login-link">
        <p>
          {{ 'AUTH.ALREADY_HAVE_ACCOUNT' | translate }}
          <a [routerLink]="['/login']" class="link">{{ 'AUTH.LOGIN' | translate }}</a>
        </p>
      </div>

      <!-- Back to Home -->
      <div class="back-home">
        <a [routerLink]="['/']" class="link-back">
          ← {{ 'COMMON.BACK_TO_HOME' | translate }}
        </a>
      </div>
    </div>
  </div>
</div>
