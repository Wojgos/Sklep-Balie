<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <!-- Logo/Header -->
      <div class="login-header">
        <h1 class="login-title">{{ 'AUTH.LOGIN' | translate }}</h1>
        <p class="login-subtitle">{{ 'AUTH.WELCOME_BACK_SHORT' | translate }}</p>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onSubmit()" class="login-form">
        <!-- Username Field -->
        <div class="form-group">
          <label for="username" class="form-label">
            {{ 'FORM.EMAIL' | translate }}
          </label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="credentials.username"
            class="form-input"
            [placeholder]="'FORM.EMAIL_PLACEHOLDER' | translate"
            [disabled]="isLoading"
            required
            autocomplete="username"
          />
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">
            {{ 'FORM.PASSWORD' | translate }}
          </label>
          <div class="password-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="credentials.password"
              class="form-input"
              [placeholder]="'FORM.PASSWORD_PLACEHOLDER' | translate"
              [disabled]="isLoading"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [disabled]="isLoading"
            >
              <span *ngIf="!showPassword">👁</span>
              <span *ngIf="showPassword">🙈</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn-submit"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">{{ 'AUTH.LOGIN' | translate }}</span>
          <span *ngIf="isLoading" class="loading-spinner">
            <span class="spinner"></span>
            {{ 'AUTH.LOGGING_IN' | translate }}
          </span>
        </button>
      </form>

      <!-- Register Link -->
      <div class="register-link">
        <p>
          {{ 'AUTH.NO_ACCOUNT' | translate }}
          <a [routerLink]="['/register']" class="link">{{ 'AUTH.REGISTER' | translate }}</a>
        </p>
      </div>

      <!-- Back to Home -->
      <div class="back-home">
        <a [routerLink]="['/']" class="link-back">
          ← {{ 'COMMON.BACK_TO_HOME' | translate }}
        </a>
      </div>
    </div>
  </div>
</div>
