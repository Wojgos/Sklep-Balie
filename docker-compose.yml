version: '3.8'

services:
  db:
    image: postgres:15
    container_name: estore_postgres
    environment:
      - POSTGRES_DB=estore_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=rafalinzynierka123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: estore_redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: estore_elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Ograniczamy pamięć RAM
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  backend:
    build: ./backend
    container_name: estore_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app # "Hot reload" - zmiany w kodzie widoczne od razu
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=estore_db
      - DB_USER=postgres
      - DB_PASS=rafalinzynierka123
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - db
      - redis
      - elasticsearch

  celery_worker:
    build: ./backend
    container_name: estore_celery_worker
    entrypoint: /app/entrypoint.sh
    command: celery -A EStore worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=estore_db
      - DB_USER=postgres
      - DB_PASS=rafalinzynierka123
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    restart: always
    depends_on:
      - backend
      - redis

  celery_beat:
    build: ./backend
    container_name: estore_celery_beat
    entrypoint: /app/entrypoint.sh
    command: sh -c "rm -f celerybeat.pid && celery -A EStore beat --loglevel=info"
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=estore_db
      - DB_USER=postgres
      - DB_PASS=rafalinzynierka123
      - REDIS_URL=redis://redis:6379/0
    restart: always
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    container_name: estore_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Zapobiega nadpisywaniu node_modules przez wolumen
    depends_on:
      - backend

volumes:
  postgres_data:
  es_data: